<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Focus, collaboration, and a fun fact</title>
  <desc id="desc">Three cards: learning Python and machine learning, welcoming questions and contributions, and disliking race conditions.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0b1424" />
      <stop offset="1" stop-color="#060914" />
    </linearGradient>
    <linearGradient id="neon">
      <stop stop-color="#67e8f9" />
      <stop offset=".5" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#f472b6" />
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#8b5cf6" stop-opacity=".25" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".045" />
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="22" fill="url(#bg)" />
  <rect width="1200" height="280" rx="22" fill="url(#grid)" />
  <rect x="20" y="16" width="372" height="244" rx="16" fill="#10172a" stroke="#28334a" />
  <path d="M44 17H150" stroke="#67e8f9" stroke-width="2" />
  <g font-family="DejaVu Sans, sans-serif">
    <text x="46" y="57" fill="#67e8f9" font-size="11" letter-spacing="2">CURRENT FOCUS</text>
    <text x="320" y="57" fill="#556581" font-size="12">01</text>
    <text x="46" y="118" fill="#67e8f9" font-family="monospace" font-size="35">&gt;_</text>
    <text x="46" y="164" fill="#edf2ff" font-size="23" font-weight="bold">Python × ML</text>
    <text x="46" y="199" fill="#a7b5cc" font-size="15">Learning how code</text>
    <text x="46" y="224" fill="#a7b5cc" font-size="15">connects to intelligence.</text>
  </g>
  <rect x="414" y="16" width="372" height="244" rx="16" fill="#10172a" stroke="#28334a" />
  <path d="M438 17H544" stroke="#a78bfa" stroke-width="2" />
  <g font-family="DejaVu Sans, sans-serif">
    <text x="440" y="57" fill="#a78bfa" font-size="11" letter-spacing="2">OPEN INVITATION</text>
    <text x="714" y="57" fill="#556581" font-size="12">02</text>
    <text x="440" y="118" fill="#a78bfa" font-family="monospace" font-size="35">{ }</text>
    <text x="440" y="164" fill="#edf2ff" font-size="23" font-weight="bold">Build together</text>
    <text x="440" y="199" fill="#a7b5cc" font-size="15">Questions welcome.</text>
    <text x="440" y="224" fill="#a7b5cc" font-size="15">Contributions welcome, too.</text>
  </g>
  <rect x="808" y="16" width="372" height="244" rx="16" fill="#10172a" stroke="#28334a" />
  <path d="M832 17H938" stroke="#f472b6" stroke-width="2" />
  <g font-family="DejaVu Sans, sans-serif">
    <text x="834" y="57" fill="#f472b6" font-size="11" letter-spacing="2">PERSONAL PATCH</text>
    <text x="1108" y="57" fill="#556581" font-size="12">03</text>
    <text x="834" y="118" fill="#f472b6" font-family="monospace" font-size="35">//</text>
    <text x="834" y="164" fill="#edf2ff" font-size="23" font-weight="bold">No race conditions</text>
    <text x="834" y="199" fill="#a7b5cc" font-size="15">One thing I definitely</text>
    <text x="834" y="224" fill="#a7b5cc" font-size="15">do not want to collect.</text>
  </g>
</svg>
