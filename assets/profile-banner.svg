<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Alessio — Full-Stack Developer</title>
  <desc id="desc">A black and deep red profile banner with Alessio’s name and Full-Stack Developer title.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909" />
      <stop offset=".58" stop-color="#190607" />
      <stop offset="1" stop-color="#A21517" />
    </linearGradient>
    <linearGradient id="flare" x1=".2" y1="0" x2="1" y2="1">
      <stop stop-color="#F04449" stop-opacity=".8" />
      <stop offset="1" stop-color="#A21517" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity=".035" />
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)" />
  <rect width="1200" height="360" rx="24" fill="url(#grid)" />
  <ellipse cx="1000" cy="185" rx="270" ry="190" fill="url(#flare)" filter="url(#softGlow)" />
  <path d="M0 310C260 260 420 390 690 310S1010 215 1200 250V360H0Z" fill="#A21517" opacity=".22" />
  <path d="M0 332C320 282 500 390 760 320S1040 244 1200 272" fill="none" stroke="#F04449" stroke-opacity=".8" stroke-width="2" />
  <path d="M54 48H230M54 48V72M1146 312H970M1146 312V288" fill="none" stroke="#E54B55" stroke-opacity=".85" stroke-width="2" />
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="72" y="82" width="240" height="30" rx="15" fill="#17090A" stroke="#A21517" />
    <circle cx="91" cy="97" r="4" fill="#F04449" />
    <text x="107" y="102" fill="#F2A0A5" font-size="11" letter-spacing="2">BACKEND · FULL-STACK</text>
    <text x="64" y="215" fill="#FFFFFF" font-size="104" font-weight="700" letter-spacing="-5">ALESSIO<tspan fill="#F04449">.</tspan></text>
    <text x="72" y="266" fill="#F3EAEA" font-size="25">Full-Stack Developer</text>
    <text x="74" y="310" fill="#D5BFC0" font-size="14" letter-spacing="1">BUILDING FROM API TO INTERFACE</text>
  </g>
  <g fill="none" stroke="#F04449">
    <circle cx="1010" cy="165" r="76" stroke-opacity=".72" stroke-width="2" />
    <circle cx="1010" cy="165" r="112" stroke-opacity=".42" />
    <circle cx="1010" cy="165" r="148" stroke-opacity=".22" />
  </g>
  <circle cx="1010" cy="165" r="28" fill="#0A0A0A" stroke="#F04449" stroke-width="2" />
  <path d="M1001 153L989 165 1001 177M1019 153L1031 165 1019 177M1015 149L1005 181" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
</svg>
